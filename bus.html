        <!-- Lightbox -->
        <div id="lightbox">
            <span id="lightbox-close">&times;</span>
            <span id="lightbox-prev">&#10094;</span>
            <span id="lightbox-next">&#10095;</span>
            <img id="lightbox-img" src="" alt="Lightbox image">
        </div>

        <!-- Your existing footer and scripts -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const galleryItems = document.querySelectorAll('.gallery-item');
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightbox-img');
                const closeLightbox = document.getElementById('lightbox-close');
                const prevBtn = document.getElementById('lightbox-prev');
                const nextBtn = document.getElementById('lightbox-next');
                let currentIndex = 0;

                // Open Lightbox
                galleryItems.forEach((item, index) => {
                    item.addEventListener('click', () => {
                        currentIndex = index;
                        lightboxImg.src = item.querySelector('img').src;
                        lightbox.style.display = 'flex';
                    });
                });

                // Close Lightbox
                closeLightbox.addEventListener('click', () => {
                    lightbox.style.display = 'none';
                });

                // Previous Image
                prevBtn.addEventListener('click', () => {
                    currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
                    lightboxImg.src = galleryItems[currentIndex].querySelector('img').src;
                });

                // Next Image
                nextBtn.addEventListener('click', () => {
                    currentIndex = (currentIndex + 1) % galleryItems.length;
                    lightboxImg.src = galleryItems[currentIndex].querySelector('img').src;
                });

                // Close lightbox when clicking outside the image
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) {
                        lightbox.style.display = 'none';
                    }
                });
            });
        </script>
